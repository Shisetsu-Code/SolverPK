name: PHH importer validation
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/phh-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests and release build
        run: |
          cargo test --all-targets
          cargo build --release
      - name: Fetch verified PHH sample from Pluribus
        run: |
          mkdir -p fixtures/pluribus
          curl --fail --location --retry 3 https://raw.githubusercontent.com/uoftcprg/phh-dataset/main/data/pluribus/100/0.phh -o fixtures/pluribus/0.phh
          curl --fail --location --retry 3 https://raw.githubusercontent.com/uoftcprg/phh-dataset/main/data/pluribus/100/11.phh -o fixtures/pluribus/11.phh
          test -s fixtures/pluribus/0.phh
          test -s fixtures/pluribus/11.phh
      - name: Import and supervised baseline
        run: |
          ./target/release/solverpk --import-phh --source fixtures/pluribus --output observations.bin | tee import.log
          test -s observations.bin
          ./target/release/solverpk --train-phh --source observations.bin --output imitation.bin | tee training.log
          test -s imitation.bin
          wc -c observations.bin imitation.bin
      - name: Upload sample importer results
        uses: actions/upload-artifact@v4
        with:
          name: phh-import-sample
          path: |
            observations.bin
            imitation.bin
            import.log
            training.log
          retention-days: 14
