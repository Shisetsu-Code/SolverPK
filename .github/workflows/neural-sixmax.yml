name: Neural v2 sixmax training and evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and compile
        run: |
          cargo test --all-targets
          cargo build --release
      - name: Train tabular baseline
        run: ./target/release/solverpk --sixmax-train --rake-bps 0 --hands 100000 --seed 4101 --checkpoint sixmax-tabular.bin | tee tabular-train.log
      - name: Train real neural MLP
        run: ./target/release/solverpk --sixmax-neural-train --rake-bps 0 --hands 20000 --learning-rate 0.002 --seed 4101 --checkpoint sixmax-neural-v2.bin | tee neural-train.log
      - name: Frozen neural versus tabular baseline
        run: ./target/release/solverpk --sixmax-neural-eval --rake-bps 0 --hands 6000 --seed 9401 --checkpoint sixmax-neural-v2.bin --tabular sixmax-tabular.bin | tee neural-vs-tabular.log
      - name: Resume the v2 checkpoint created in this run
        run: ./target/release/solverpk --sixmax-neural-train --rake-bps 0 --resume --hands 5000 --learning-rate 0.001 --seed 4102 --checkpoint sixmax-neural-v2.bin | tee neural-resume.log
      - name: Supervised neural distillation from tabular teacher
        run: ./target/release/solverpk --sixmax-neural-distill --rake-bps 0 --hands 100000 --seed 6101 --teacher sixmax-tabular.bin --checkpoint sixmax-neural-v2-distilled.bin | tee neural-distill.log
      - name: Frozen distilled neural vs tabular
        run: ./target/release/solverpk --sixmax-neural-eval --rake-bps 0 --hands 12000 --seed 9401 --checkpoint sixmax-neural-v2-distilled.bin --tabular sixmax-tabular.bin | tee neural-distilled-vs-tabular.log
      - name: Upload neural model and benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sixmax-neural-v2-baseline
          path: |
            sixmax-neural-v2.bin
            sixmax-tabular.bin
            neural-train.log
            neural-resume.log
            neural-vs-tabular.log
            tabular-train.log
            sixmax-neural-v2-distilled.bin
            neural-distill.log
            neural-distilled-vs-tabular.log
          retention-days: 30
          if-no-files-found: warn
