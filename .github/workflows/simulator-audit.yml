name: Simulator accounting audit
on:
  push:
    branches: [main, 'audit/simulator-accounting-20261119']
    paths: ['src/**', 'Cargo.toml', '.github/workflows/simulator-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Unit and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-targets 2>&1 | tee audit-tests.log
      - name: Exhaustive independent five-card reference
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release exhaustive_five_card -- --ignored --nocapture 2>&1 | tee audit-exhaustive.log
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-audit-evidence
          path: |
            audit-*.log
            target/release/solverpk
          retention-days: 90
          if-no-files-found: warn
