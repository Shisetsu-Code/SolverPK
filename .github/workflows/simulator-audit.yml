name: Simulator accounting audit
on:
  push:
    branches: [main, 'audit/simulator-accounting-20261119', 'fix/neural-v2-20261119']
    paths: ['src/**', 'tests/**', 'scripts/audit_evaluate.py', 'Cargo.toml', '.github/workflows/simulator-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Unit and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --all-targets --no-fail-fast 2>&1 | tee audit-tests.log
      - name: Exhaustive independent five-card reference
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release exhaustive_five_card -- --ignored --nocapture 2>&1 | tee audit-exhaustive.log
      - name: Independent accounting over 100000 legal hands
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release audit_stress -- --ignored --nocapture 2>&1 | tee audit-stress.log
      - name: Restore immutable 100M checkpoint and frozen opponents
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/audit/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit-models
          gh run download 44564068762 --repo Shisetsu-Code/SolverPK --name neural-100m-full-evidence --dir audit-models
          gh run download 44550178708 --repo Shisetsu-Code/SolverPK --name sixmax-phh-ablation --dir audit-models
          gh run download 44541033820 --repo Shisetsu-Code/SolverPK --name pluribus-full-import-training --dir audit-models
      - name: Frozen reevaluation with explicit rake and new seeds
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/audit/')
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_evaluate.py --hands 120000 2>&1 | tee audit-evaluation.log
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-audit-evidence
          path: |
            audit-*.log
            audit-evaluation.json
            target/release/solverpk
          retention-days: 90
          if-no-files-found: warn
