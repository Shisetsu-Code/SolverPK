name: Rust CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --all-targets
      - name: Simulator smoke test
        run: cargo run --release -- --hands 100 --samples 8 --seed 42
      - name: Self-play smoke test and checkpoint resume
        run: |
          cargo run --release -- --self-play --hands 200 --rooms 16 --agents 8 --samples 2 --checkpoint selfplay.bin
          cargo run --release -- --self-play --resume --hands 100 --rooms 16 --agents 8 --samples 2 --checkpoint selfplay.bin
