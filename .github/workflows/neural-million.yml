name: Neural distillation from million-hand 6max teacher
on:
  push:
    paths:
      - '.github/workflows/neural-million.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  neural:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and compile
        run: |
          cargo test --all-targets
          cargo build --release
      - name: Restore one-million-hand teacher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          gh run download 44550178708 --repo Shisetsu-Code/SolverPK --name sixmax-phh-ablation --dir models
          test -s models/scratch.bin
          gh run download 44541033820 --repo Shisetsu-Code/SolverPK --name pluribus-full-import-training --dir models
          test -s models/pluribus-imitation.bin
      - name: Distill 250k complete hands
        run: ./target/release/solverpk --sixmax-neural-distill --teacher models/scratch.bin --hands 250000 --seed 71115 --checkpoint neural-250k.bin | tee distill-250k.log
      - name: Evaluate 250k neural vs teacher and PHH imitation
        run: |
          ./target/release/solverpk --sixmax-neural-eval --hands 60000 --seed 94115 --checkpoint neural-250k.bin --tabular models/scratch.bin | tee eval-250k-teacher.log
          ./target/release/solverpk --sixmax-neural-eval --hands 60000 --seed 94115 --checkpoint neural-250k.bin --tabular models/scratch.bin --phh-model models/pluribus-imitation.bin | tee eval-250k-phh.log
      - name: Continue distillation to one million hands
        run: ./target/release/solverpk --sixmax-neural-distill --resume --teacher models/scratch.bin --hands 750000 --seed 71116 --checkpoint neural-250k.bin | tee distill-1m.log
      - name: Evaluate final neural vs teacher and PHH imitation
        run: |
          ./target/release/solverpk --sixmax-neural-eval --hands 120000 --seed 94115 --checkpoint neural-250k.bin --tabular models/scratch.bin | tee eval-1m-teacher.log
          ./target/release/solverpk --sixmax-neural-eval --hands 120000 --seed 94115 --checkpoint neural-250k.bin --tabular models/scratch.bin --phh-model models/pluribus-imitation.bin | tee eval-1m-phh.log
      - name: Save model and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sixmax-neural-million
          path: |
            neural-250k.bin
            distill-250k.log
            distill-1m.log
            eval-250k-teacher.log
            eval-250k-phh.log
            eval-1m-teacher.log
            eval-1m-phh.log
          retention-days: 30
          if-no-files-found: warn
